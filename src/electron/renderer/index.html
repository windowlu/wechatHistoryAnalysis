<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信客户识别系统</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <!-- 配置页 -->
  <div id="config-page" class="page active">
    <header class="app-header">
      <h1>微信客户识别系统</h1>
      <p class="subtitle">从聊天记录中自动识别B端/C端客户并提取关键信息</p>
    </header>

    <main class="config-form">
      <section class="form-section">
        <h2>基本配置</h2>

        <div class="form-group">
          <label for="data-path">微信数据目录</label>
          <div class="input-with-button">
            <input type="text" id="data-path" placeholder="留空将自动检测，或手动选择包含 wxid_xxx 文件夹的目录">
            <button id="btn-browse-data" class="btn-secondary">浏览</button>
          </div>
          <span class="hint">留空时自动检测；微信数据通常包含 wxid_xxx 账号文件夹</span>
        </div>

        <div class="form-group static-info">
          <label>大语言模型</label>
          <div class="static-value">
            <span class="provider-badge">Kimi（Moonshot）</span>
            <span class="model-name">kimi-k2-6</span>
          </div>
          <span class="hint">模型配置已内置，无需手动填写 API Key 或选择服务商</span>
        </div>
      </section>

      <section class="form-section">
        <h2>客户识别配置</h2>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="filter-non-customers" checked>
            <span>过滤非客户（只保留识别为客户的联系人）</span>
          </label>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="target-customer-type">目标客户类型</label>
            <select id="target-customer-type">
              <option value="">全部</option>
              <option value="b2b">B端客户（企业/法人）</option>
              <option value="b2c">C端客户（个人考生）</option>
            </select>
          </div>
          <div class="form-group half">
            <label for="min-confidence">最低置信度 (0-1)</label>
            <input type="number" id="min-confidence" value="0.6" min="0" max="1" step="0.1">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="lookback-days">最近 N 天有聊天</label>
            <input type="number" id="lookback-days" value="7" min="0" max="365" step="1">
            <span class="hint">0 表示全量分析</span>
          </div>
        </div>
      </section>

      <section class="form-section collapsible">
        <h2 class="collapsible-header">
          <span>高级配置</span>
          <span class="toggle-icon">▼</span>
        </h2>
        <div class="collapsible-body collapsed">
          <div class="form-row">
            <div class="form-group half">
              <label for="decrypt-tool-type">解密工具类型</label>
              <select id="decrypt-tool-type">
                <option value="pywxdump">PyWxDump (推荐)</option>
                <option value="generic">通用工具</option>
              </select>
            </div>
            <div class="form-group half">
              <label for="python-path">Python 路径</label>
              <input type="text" id="python-path" placeholder="python" value="python">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group half">
              <label for="concurrency">并发数</label>
              <input type="number" id="concurrency" value="3" min="1" max="10">
            </div>
            <div class="form-group half">
              <label for="batch-size">批次大小</label>
              <input type="number" id="batch-size" value="10" min="1" max="50">
            </div>
          </div>

          <div class="form-group">
            <label for="output-dir">输出目录</label>
            <input type="text" id="output-dir" placeholder="./output" value="./output">
          </div>

          <div class="form-group">
            <label for="log-level">日志级别</label>
            <select id="log-level">
              <option value="info">info</option>
              <option value="debug">debug</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </div>
        </div>
      </section>

      <div class="form-actions">
        <button id="btn-start" class="btn-primary btn-large">开始识别</button>
      </div>
    </main>
  </div>

  <!-- 运行中页 -->
  <div id="running-page" class="page">
    <header class="app-header">
      <h1>识别中...</h1>
    </header>

    <main class="running-panel">
      <div class="progress-area">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <div class="progress-info">
          <span id="progress-percent">0%</span>
          <span id="progress-message">准备开始</span>
        </div>
      </div>

      <div class="log-terminal">
        <div class="log-header">实时日志</div>
        <div id="log-content" class="log-content"></div>
      </div>

      <div class="form-actions">
        <button id="btn-cancel" class="btn-secondary">取消</button>
      </div>
    </main>
  </div>

  <!-- 结果页 -->
  <div id="result-page" class="page">
    <header class="app-header">
      <h1>识别结果</h1>
    </header>

    <main class="result-panel">
      <!-- 概览卡片 -->
      <div class="overview-cards" id="overview-cards">
        <div class="card">
          <div class="card-value" id="stat-duration">-</div>
          <div class="card-label">总耗时</div>
        </div>
        <div class="card success">
          <div class="card-value" id="stat-customers">-</div>
          <div class="card-label">客户总数</div>
        </div>
        <div class="card">
          <div class="card-value" id="stat-b2b">-</div>
          <div class="card-label">B端客户</div>
        </div>
        <div class="card">
          <div class="card-value" id="stat-b2c">-</div>
          <div class="card-label">C端客户</div>
        </div>
      </div>

      <!-- 图表区域 -->
      <div class="charts-area">
        <div class="chart-box">
          <h3>客户类型分布</h3>
          <div id="chart-type-distribution" class="chart-container"></div>
        </div>
        <div class="chart-box">
          <h3>需求类型分布</h3>
          <div id="chart-demand-distribution" class="chart-container"></div>
        </div>
      </div>

      <!-- 客户列表 -->
      <div class="sessions-area">
        <h3>客户列表</h3>
        <div class="table-container">
          <table id="sessions-table">
            <thead>
              <tr>
                <th>会话</th>
                <th>类型</th>
                <th>子类型</th>
                <th>需求/考试</th>
                <th>地区</th>
                <th>跟进状态</th>
                <th>置信度</th>
                <th>消息数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="sessions-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 输出文件 -->
      <div class="output-area" id="output-area">
        <h3>输出文件</h3>
        <div id="output-files" class="output-files"></div>
      </div>

      <div class="form-actions">
        <button id="btn-back" class="btn-primary">返回配置页</button>
      </div>
    </main>
  </div>

  <!-- 错误弹窗 -->
  <div id="error-modal" class="modal">
    <div class="modal-content">
      <h3>出错了</h3>
      <p id="error-message"></p>
      <button id="btn-error-ok" class="btn-primary">确定</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
